name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner-base-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Load tool versions
        id: versions
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . versions.env
          out=""
          for v in GO_VERSION NODE_VERSION PYTHON_VERSION UV_VERSION RUNNER_VERSION; do
            out+="${v}=${!v}"$'\n'
          done
          {
            printf '%s' "${out}"
          } > /tmp/build-args.env
          {
            echo "build-args<<EOF"
            cat /tmp/build-args.env
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push edge
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: docker.io/jrepp/runner-base:edge
          build-args: ${{ steps.versions.outputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/runner-smoke \
            "docker.io/jrepp/runner-base@${{ steps.build.outputs.digest }}"

      # Tags created with the default GITHUB_TOKEN do not trigger workflows,
      # so the versioned image tags are created here in the same run instead of
      # by a separate tag-push workflow.
      - name: Cut semantic release
        id: release
        run: npx --yes semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag versioned image
        if: steps.release.outcome == 'success'
        env:
          EDGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          new_tag="$(git tag --points-at HEAD | sort -V | tail -1 || true)"
          if [[ -z "${new_tag}" ]]; then
            echo "no release for this commit; edge tag only"
            exit 0
          fi
          version="${new_tag#v}"
          docker buildx imagetools create \
            --tag "docker.io/jrepp/runner-base:${version}" \
            "docker.io/jrepp/runner-base:edge"
          docker buildx imagetools create \
            --tag "docker.io/jrepp/runner-base:latest" \
            "docker.io/jrepp/runner-base:edge"
          mkdir -p dist
          printf 'docker.io/jrepp/runner-base@%s\n' "${EDGE_DIGEST}" > dist/runner-image.txt

      - name: Upload digest asset to release
        if: steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new_tag="$(git tag --points-at HEAD | sort -V | tail -1 || true)"
          [[ -z "${new_tag}" ]] && exit 0
          gh release upload "${new_tag}" dist/runner-image.txt --clobber

      - name: Summarize
        run: |
          set -euo pipefail
          if [[ -f dist/runner-image.txt ]]; then
            cat dist/runner-image.txt
          else
            echo "edge built; no new release for this commit"
          fi
