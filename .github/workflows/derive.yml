name: Build derived runner image

on:
  workflow_call:
    inputs:
      image:
        description: >-
          Target image reference, e.g. ghcr.io/owner/repo:edge or
          docker.io/owner/repo:edge
        required: true
        type: string
      config:
        description: Path to the declarative .github/runner-image.yml
        required: false
        type: string
        default: .github/runner-image.yml
      dockerfile:
        description: >-
          Build the repository's own Dockerfile instead of the declarative
          config (the escape hatch)
        required: false
        type: boolean
        default: false
      login:
        description: >-
          Authenticate to the target registry first (set when the image is
          private or the registry enforces auth)
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: Immutable digest of the built derived image
        value: ${{ jobs.build-derived.outputs.digest }}
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

jobs:
  build-derived:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Login to registry
        if: inputs.login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Render declarative Dockerfile
        if: ${{ ! inputs.dockerfile }}
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          scripts/derive-dockerfile "${CONFIG}" > /tmp/Dockerfile.derived
          cat /tmp/Dockerfile.derived

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          file: ${{ inputs.dockerfile && 'Dockerfile' || '/tmp/Dockerfile.derived' }}
          tags: ${{ inputs.image }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Report digest
        run: |
          set -euo pipefail
          printf 'image: %s\ndigest: %s\n' "${{ inputs.image }}" "${{ steps.build.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"
