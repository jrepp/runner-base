name: Pull Request

# Build and release runs on main: it publishes the edge image and cuts a
# semantic release, neither of which belongs on a pull request. So pull
# requests get their own build here, of the same image with the same
# arguments, that stops before publishing anything.
#
# It also gives Mergify something to wait on. `check-success=build` was the
# merge condition all along, and no build check has ever existed on a pull
# request, so the condition could never be met.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Load tool versions
        id: versions
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . versions.env
          {
            echo "build-args<<EOF"
            for v in GO_VERSION NODE_VERSION PYTHON_VERSION UV_VERSION RUNNER_VERSION; do
              printf '%s=%s\n' "${v}" "${!v}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # No registry login, nothing pushed. The image is loaded into the local
      # daemon so the smoke test can run against it by tag rather than by a
      # digest that only a push would produce.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: runner-base:pr
          build-args: ${{ steps.versions.outputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/runner-smoke runner-base:pr

  mergify-config:
    name: Mergify Config Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Install the Mergify CLI
        run: curl -fsSL https://raw.githubusercontent.com/Mergifyio/mergify-cli/main/install.sh | sh

      - name: Validate .mergify.yml
        run: mergify config validate --config-file .mergify.yml
