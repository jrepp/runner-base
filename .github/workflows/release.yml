name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: runner-base-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: codfish/semantic-release-action@v5
        id: semantic
        with:
          additional-packages: |
            ['conventional-changelog-conventionalcommits@7']
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report version
        if: steps.semantic.outputs.new-release-published == 'true'
        run: |
          set -euo pipefail
          echo "Released v${RELEASE_VERSION} (tag ${RELEASE_GIT_TAG})" >> "$GITHUB_STEP_SUMMARY"
